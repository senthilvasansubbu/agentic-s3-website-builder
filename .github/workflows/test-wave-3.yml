# Naming standard: <Category> | <Scope> | <Purpose>
name: Test | Wave 3 | Stability and Quality Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "app.py"
      - "main.py"
      - "api/**"
      - "services/**"
      - "frontend/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/test-wave-3.yml"
  push:
    branches: [main]
    paths:
      - "app.py"
      - "main.py"
      - "api/**"
      - "services/**"
      - "frontend/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/test-wave-3.yml"

permissions:
  contents: read

concurrency:
  group: wave-3-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wave3-stability-quality-tests:
    name: wave3-stability-quality-tests
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: "github-actions-test-secret-do-not-use-in-prod"
      OPENAI_API_KEY: ""
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      STORAGE_SECRETS_KEY: ""
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_REGION: "us-east-1"
      S3_BUCKET_NAME: ""
      SQLITE_DB_PATH: ":memory:"
      VERBOSE_MODE: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Wave 3 test suite
        run: |
          pytest \
            tests/test_auth.py \
            tests/test_website_crud.py \
            tests/test_payment_webhook.py \
            --cov=services \
            --cov=api \
            --cov=frontend \
            --cov-report=xml:coverage-wave3.xml \
            -v \
            --tb=short \
            --maxfail=1

      - name: Upload Wave 3 coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-wave3-xml
          path: coverage-wave3.xml
          retention-days: 30

  wave3-health-gate:
    name: wave3-health-gate
    needs: [wave3-stability-quality-tests]
    uses: ./.github/workflows/health-gate.yml
    with:
      start_local_server: true
      base_url: http://127.0.0.1:8000
      require_auth_negative_401: true
      expected_health_status: "200"

  wave3-coverage-metrics-gate:
    name: wave3-coverage-metrics-gate
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: "github-actions-test-secret-do-not-use-in-prod"
      OPENAI_API_KEY: ""
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      STORAGE_SECRETS_KEY: ""
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_REGION: "us-east-1"
      S3_BUCKET_NAME: ""
      SQLITE_DB_PATH: ":memory:"
      VERBOSE_MODE: "false"
      COVERAGE_FAIL_UNDER: "80"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run coverage gate for DB client
        run: |
          pytest \
            tests/test_sqlite_pooling.py \
            --cov=database.snowflake_client \
            --cov-config=pyproject.toml \
            --cov-fail-under=80 \
            --cov-report=term-missing \
            --cov-report=xml:coverage-wave3-db.xml \
            --cov-report=html:coverage-wave3-db-html \
            -v \
            --tb=short

      - name: Upload Wave 3 DB coverage XML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-wave3-db-xml
          path: coverage-wave3-db.xml
          retention-days: 30

      - name: Upload Wave 3 DB coverage HTML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-wave3-db-html
          path: coverage-wave3-db-html/
          retention-days: 30
