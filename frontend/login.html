<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Builder — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: #fff; border-radius: 16px; padding: 48px 40px;
      width: 100%; max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }
    .logo { text-align: center; margin-bottom: 32px; }
    .logo svg { width: 56px; height: 56px; }
    .logo h1 { font-size: 1.5rem; color: #1a202c; margin-top: 12px; font-weight: 700; }
    .logo p  { color: #718096; font-size: .9rem; margin-top: 4px; }

    label { display: block; font-size: .85rem; font-weight: 600; color: #4a5568; margin-bottom: 6px; }
    input {
      width: 100%; padding: 12px 16px; border: 1.5px solid #e2e8f0;
      border-radius: 8px; font-size: 1rem; transition: border-color .2s;
      outline: none;
    }
    input:focus { border-color: #667eea; }
    .field { margin-bottom: 20px; }
    .pass-wrap { position: relative; }
    .pass-wrap input { padding-right: 44px; }
    .toggle-pass {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: #a0aec0; font-size: 1.1rem;
    }

    .btn {
      width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: opacity .2s; margin-top: 8px;
    }
    .btn:hover { opacity: .88; }
    .btn:disabled { opacity: .6; cursor: not-allowed; }

    .error {
      background: #fff5f5; border: 1px solid #feb2b2; color: #c53030;
      border-radius: 8px; padding: 12px 16px; font-size: .9rem;
      margin-bottom: 16px; display: none;
    }
    .error.show { display: block; }

    .spinner {
      display: inline-block; width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,.4); border-top-color: #fff;
      border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer { text-align: center; margin-top: 24px; color: #a0aec0; font-size: .82rem; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="56" height="56" rx="14" fill="url(#grad)"/>
      <path d="M14 20h28M14 28h18M14 36h22" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <circle cx="42" cy="34" r="7" fill="#f093fb"/>
      <path d="M39 34l2 2 4-4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <defs>
        <linearGradient id="grad" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
          <stop stop-color="#667eea"/><stop offset="1" stop-color="#764ba2"/>
        </linearGradient>
      </defs>
    </svg>
    <h1>Website Builder</h1>
    <p>Sign in to your admin console</p>
  </div>

  <div class="error" id="error-msg"></div>

  <form id="login-form">
    <div class="field">
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="admin@websitebuilder.ai" required autocomplete="email">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <div class="pass-wrap">
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        <button type="button" class="toggle-pass" onclick="togglePassword()">👁</button>
      </div>
    </div>
    <button type="submit" class="btn" id="submit-btn">Sign In</button>
  </form>

  <div class="footer">Agentic AI Website Builder &copy; 2026</div>
</div>

<script>
  function togglePassword() {
    const input = document.getElementById('password');
    input.type = input.type === 'password' ? 'text' : 'password';
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const errEl = document.getElementById('error-msg');
    errEl.classList.remove('show');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Signing in…';

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
      const res = await fetch('/api/v1/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.detail || 'Login failed');
      }

      // Store token
      localStorage.setItem('wb_token', data.access_token);
      localStorage.setItem('wb_user_id', data.user_id);
      localStorage.setItem('wb_plan', data.plan);

      // Redirect based on role
      if (data.plan === 'superuser') {
        window.location.href = '/console';
      } else {
        window.location.href = '/dashboard';
      }
    } catch (err) {
      errEl.textContent = err.message;
      errEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  });

  // Redirect if already logged in
  if (localStorage.getItem('wb_token')) {
    const plan = localStorage.getItem('wb_plan');
    window.location.href = plan === 'superuser' ? '/console' : '/dashboard';
  }
</script>
</body>
</html>
